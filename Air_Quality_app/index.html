<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Air Quality — Cyprus</title>
    <meta
      name="description"
      content="Live air quality for Nicosia, Larnaca, Limassol, Ayia Napa and Paphos: US and European AQI, pollutants, Saharan dust and a 48-hour forecast."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Air Quality — Cyprus" />
    <meta
      property="og:description"
      content="Live air quality for the main cities of Cyprus: AQI, pollutants, Saharan dust and forecast."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        // Colour of the phone's browser bar / status bar follows the theme.
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute("content", theme === "dark" ? "#0b0b0b" : "#ffffff");
      })();
    </script>
    <link
      rel="preload"
      href="fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <noscript>This app needs JavaScript to load the air quality data.</noscript>

    <main class="app-container">
      <header class="site-header">
        <div class="brand">
          <h1 data-i18n="app.name">Air Quality</h1>
          <span class="site-header-tag" data-i18n="header.tag">Cyprus</span>
        </div>

        <div class="controls">
          <div class="opt-group lang-group" role="group" data-i18n-aria="lang.aria">
            <button type="button" class="opt" data-lang="en" lang="en" aria-pressed="false">EN</button>
            <button type="button" class="opt" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
            <button type="button" class="opt" data-lang="el" lang="el" aria-pressed="false">EL</button>
          </div>

          <div class="opt-group index-group" role="group" data-i18n-aria="index.aria">
            <button type="button" class="opt" data-index="us" data-i18n="index.us" data-i18n-title="tip.us" aria-pressed="true">US AQI</button>
            <button type="button" class="opt" data-index="eu" data-i18n="index.eu" data-i18n-title="tip.eu" aria-pressed="false">EU AQI</button>
          </div>

          <button type="button" class="opt install-button" data-i18n="pwa.install" hidden></button>

          <button
            type="button"
            class="icon-button theme-switch"
            role="switch"
            aria-checked="false"
            data-i18n-aria="theme.mode"
            data-i18n-title="theme.mode"
          >
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4" />
            </svg>
          </button>
        </div>
      </header>

      <div class="picker-wrap">
        <button type="button" class="picker-arrow picker-arrow-left" data-i18n-aria="picker.prev" tabindex="-1">&lsaquo;</button>
        <div class="city-picker" role="group" data-i18n-aria="picker.aria"></div>
        <button type="button" class="picker-arrow picker-arrow-right" data-i18n-aria="picker.next" tabindex="-1">&rsaquo;</button>
      </div>

      <div class="layout" data-tab="now">
        <!-- Left: live data -->
        <section class="information-block">
          <div class="loader active" role="status" aria-label="Loading">
            <span class="loader-line"></span>
          </div>

          <div class="air-a">
          <div class="status-row">
            <p class="user-information" aria-live="polite"></p>
            <div class="status-actions">
              <button type="button" class="link-button share-button" data-i18n="share.button" hidden></button>
              <button type="button" class="link-button refresh-button" hidden></button>
            </div>
          </div>

          <p class="label" data-i18n="hero" data-i18n-var></p>
          <div class="hero">
            <p class="pollution-value">&ndash;</p>
            <div class="hero-meta">
              <p class="hero-quality">
                <span class="level-dot" aria-hidden="true"></span>
                <span class="pollution-info">&ndash;</span>
              </p>
              <p class="city-name">&ndash;</p>
            </div>
          </div>
          <p class="level-advice"></p>

          <!-- Always visible: what the chosen index means -->
          <div class="index-about">
            <p class="label" data-i18n="idx.about" data-i18n-var></p>
            <p class="index-blurb" data-i18n="idx.blurb" data-i18n-var></p>
            <button type="button" class="link-button index-help" data-i18n="index.help"></button>
          </div>

          </div>

          <div class="air-b">
          <p class="label block-label">
            <span data-i18n="pollutants.label"></span>
            <span class="label-hint" data-i18n="pollutants.hint"></span>
          </p>
          <div class="pollutants" role="group" data-i18n-aria="pollutants.aria"></div>

          <div class="dust">
            <button
              type="button"
              class="switch dust-switch"
              role="switch"
              aria-checked="true"
            >
              <span class="switch-label" data-i18n="dust.switch"></span>
              <span class="switch-track" aria-hidden="true"></span>
            </button>

            <div class="dust-more">
              <p class="dust-reading">
                <span class="dust-value">&ndash;</span>
                <span class="dust-unit">&micro;g/m&sup3;</span>
                <span class="dust-note" data-i18n="dust.note"></span>
              </p>
              <button type="button" class="link-button dust-how-link" data-i18n="dust.how"></button>
              <button type="button" class="dust-how-icon" data-i18n-aria="dust.how" data-i18n-title="dust.how">?</button>
            </div>
          </div>

          </div>

          <div class="air-c">
          <div class="forecast">
            <div class="forecast-head">
              <p class="label" data-i18n="forecast.label"></p>
              <div class="opt-group chart-tabs" role="group" data-i18n-aria="forecast.aria">
                <button type="button" class="opt" data-chart="aqi" data-i18n="forecast.tab.aqi" aria-pressed="true"></button>
                <button type="button" class="opt dust-tab" data-chart="dust" data-i18n="forecast.tab.dust" aria-pressed="false"></button>
              </div>
            </div>
            <div class="chart"></div>
            <p class="chart-readout"></p>
          </div>

          <p class="label block-label" data-i18n="scale.label"></p>
          <div class="scale-container">
            <span class="location-pointer" aria-hidden="true"></span>
          </div>
          <ul class="level-legend"></ul>

          <!-- Short credit for narrow screens, where the footer is hidden -->
          <p class="credit-mini compact-only" data-i18n-html="credit.mini"></p>
          </div>
        </section>

        <div class="side">
        <!-- Map: an original way to pick a place (or any spot on the island) -->
        <section class="map-block">
          <p class="label" data-i18n="map.label"></p>
          <div class="map" role="group" data-i18n-aria="map.aria"></div>
          <p class="map-hint" data-i18n="map.hint"></p>
        </section>

        <!-- How it works (one section open at a time) -->
        <aside class="description">
          <section class="info-group">
            <h2 class="group-title" data-i18n="group.explanation"></h2>

            <details class="panel" name="panel" open>
              <summary><span class="panel-title" data-i18n="panel.calc"></span></summary>
              <div class="panel-body">
                <ol class="steps">
                  <li data-i18n-html="calc.s1"></li>
                  <li>
                    <span data-i18n-html="calc.s2" data-i18n-var></span>
                    <span class="formula" data-i18n-html="calc.formula"></span>
                  </li>
                  <li data-i18n-html="calc.s3" data-i18n-var></li>
                </ol>
              </div>
            </details>

            <details class="panel panel-index" name="panel">
              <summary><span class="panel-title" data-i18n="panel.index"></span></summary>
              <div class="panel-body">
                <p class="index-now" aria-live="polite"></p>
                <section class="index-card" data-index="us">
                  <h3 data-i18n="idx.us.title"></h3>
                  <dl class="index-facts">
                    <div><dt data-i18n="idx.dt.who"></dt><dd data-i18n="idx.us.who"></dd></div>
                    <div><dt data-i18n="idx.dt.scale"></dt><dd data-i18n="idx.us.scale"></dd></div>
                    <div><dt data-i18n="idx.dt.pollutants"></dt><dd data-i18n="idx.us.pollutants"></dd></div>
                    <div><dt data-i18n="idx.dt.levels"></dt><dd data-i18n="idx.us.levels"></dd></div>
                  </dl>
                </section>
                <section class="index-card" data-index="eu">
                  <h3 data-i18n="idx.eu.title"></h3>
                  <dl class="index-facts">
                    <div><dt data-i18n="idx.dt.who"></dt><dd data-i18n="idx.eu.who"></dd></div>
                    <div><dt data-i18n="idx.dt.scale"></dt><dd data-i18n="idx.eu.scale"></dd></div>
                    <div><dt data-i18n="idx.dt.pollutants"></dt><dd data-i18n="idx.eu.pollutants"></dd></div>
                    <div><dt data-i18n="idx.dt.levels"></dt><dd data-i18n="idx.eu.levels"></dd></div>
                  </dl>
                </section>
                <p class="panel-note" data-i18n="idx.note"></p>
              </div>
            </details>

            <details class="panel panel-levels" name="panel">
              <summary><span class="panel-title" data-i18n="panel.levels"></span></summary>
              <div class="panel-body">
                <p class="panel-note levels-intro" data-i18n="lvl.sensitive"></p>
                <div class="level-list"></div>
                <p class="panel-note" data-i18n="lvl.disclaimer"></p>
              </div>
            </details>

            <details class="panel panel-pollutants" name="panel">
              <summary><span class="panel-title" data-i18n="panel.pollutants"></span></summary>
              <div class="panel-body">
                <div class="pollutant-list"></div>
              </div>
            </details>

            <details class="panel panel-dust" name="panel">
              <summary><span class="panel-title" data-i18n="panel.dust"></span></summary>
              <div class="panel-body">
                <ol class="steps">
                  <li data-i18n-html="dust.s1"></li>
                  <li data-i18n-html="dust.s2"></li>
                  <li data-i18n-html="dust.s3"></li>
                </ol>
                <p class="panel-note" data-i18n="dust.footnote"></p>
              </div>
            </details>

            <details class="panel" name="panel">
              <summary><span class="panel-title" data-i18n="panel.data"></span></summary>
              <div class="panel-body">
                <p data-i18n-html="data.p1"></p>
                <p class="panel-note" data-i18n-html="data.p2"></p>
                <p class="panel-note" data-i18n-html="data.p3"></p>
                <p class="panel-note compact-only" data-i18n-html="footer.data"></p>
                <p class="panel-note compact-only" data-i18n="footer.disclaimer"></p>
              </div>
            </details>
          </section>

          <section class="info-group">
            <h2 class="group-title" data-i18n="group.ideas"></h2>

            <details class="panel" name="panel">
              <summary><span class="panel-title" data-i18n="panel.ideas"></span></summary>
              <div class="panel-body">
                <ul class="ideas">
                  <li data-i18n="ideas.1"></li>
                  <li data-i18n="ideas.2"></li>
                  <li data-i18n="ideas.3"></li>
                  <li data-i18n="ideas.4"></li>
                </ul>
              </div>
            </details>
          </section>
        </aside>
        </div>
      </div>

      <footer class="site-footer">
        <p data-i18n-html="footer.data"></p>
        <p data-i18n="footer.disclaimer"></p>
      </footer>

      <!-- Phone navigation: one section at a time (hidden on large screens) -->
      <nav class="tabbar" data-i18n-aria="tabs.aria">
        <button type="button" class="tab" data-tab="now" aria-current="true" data-i18n="tab.now"></button>
        <button type="button" class="tab" data-tab="map" aria-current="false" data-i18n="tab.map"></button>
        <button type="button" class="tab" data-tab="learn" aria-current="false" data-i18n="tab.learn"></button>
      </nav>
    </main>

    <script src="aqi.js"></script>
    <script src="map.js"></script>
    <script src="i18n.js"></script>
    <script src="main.js"></script>
  </body>
</html>
