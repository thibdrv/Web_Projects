<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retrieve Job</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Retrieve Job</h1>
      <nav class="top-nav">
        <a href="#contact" id="nav-contact" data-i18n="nav_contact" hidden>Contact</a>
        <div class="lang" role="group" data-i18n-aria="lang_aria" aria-label="Langue">
          <button type="button" class="lang-btn" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </nav>
    </div>
    <p data-i18n="intro"></p>
  </header>

  <main>
    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab active" data-tab="types" data-i18n="tab_types"></button>
        <button type="button" role="tab" class="tab" data-tab="filters" data-i18n="tab_filters"></button>
        <button type="button" role="tab" class="tab" data-tab="sites" data-i18n="tab_sites"></button>
      </div>
      <form id="form" autocomplete="off">
        <div id="tab-types" class="panel"></div>
        <div id="tab-filters" class="panel" hidden></div>
        <div id="tab-sites" class="panel" hidden></div>
      </form>
    </section>

    <section class="bar">
      <button type="button" id="search" class="primary"></button>
      <button type="button" id="download" data-i18n="btn_download" disabled></button>
      <button type="button" id="import-button" data-i18n="btn_import"></button>
      <input type="file" id="import" accept=".xlsx" hidden>
      <button type="button" id="reset" data-i18n="btn_reset"></button>
      <button type="button" id="wipe" class="danger" data-i18n="btn_wipe"></button>
    </section>
    <p id="notice" class="notice" role="status" hidden></p>

    <pre id="log" class="log" aria-live="polite" hidden></pre>

    <section class="card" id="results" hidden>
      <div class="results-head">
        <h2><span data-i18n="results_title"></span> <span id="count"></span></h2>
        <input type="search" id="filter-text" data-i18n-placeholder="filter_placeholder">
        <select id="filter-category"><option value="" data-i18n="all_categories"></option></select>
      </div>
      <p class="hint" data-i18n="results_hint"></p>
      <div class="table-wrap"><table id="table"></table></div>
    </section>

    <section class="card help">
      <h2 data-i18n="help_title"></h2>
      <ul>
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
      </ul>
    </section>

    <section class="card" id="contact" hidden>
      <h2 data-i18n="contact_title"></h2>
      <p data-i18n="contact_text"></p>
      <p><a class="button primary" id="contact-link" href="#" data-i18n="contact_button"></a></p>
      <p class="hint" data-i18n="contact_note"></p>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
