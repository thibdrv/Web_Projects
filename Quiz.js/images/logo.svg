<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Question.js">
  <!-- Logo original : une planète, son orbite et un satellite -->
  <g transform="rotate(-28 24 24)">
    <!-- orbite : moitié arrière, planète, puis moitié avant par-dessus -->
    <path d="M3.5 24 A20.5 7.5 0 0 1 44.5 24" fill="none" stroke="#00ae9d" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="11.5" fill="#003247"/>
    <path d="M3.5 24 A20.5 7.5 0 0 0 44.5 24" fill="none" stroke="#00ae9d" stroke-width="2.6" stroke-linecap="round"/>
    <!-- satellite -->
    <circle cx="38.8" cy="29.5" r="3.4" fill="#00ae9d" stroke="#ffffff" stroke-width="1.6"/>
  </g>
</svg>
